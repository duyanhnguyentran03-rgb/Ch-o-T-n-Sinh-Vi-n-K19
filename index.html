<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chào Tân Sinh Viên K19</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef7ff;color:#083b78}
.wrap{max-width:640px;margin:auto;padding:18px;text-align:center}
h1{margin:4px 0 6px;font-size:28px;line-height:1.1}
p{margin:0 0 16px}
.stage{
  position:relative;
  width:min(92vw,560px);
  aspect-ratio:1;
  margin:auto;
  overflow:hidden;
  background:#fff;
  border-radius:22px;
  box-shadow:0 8px 30px #0b4d8c22;
  touch-action:none;
  user-select:none;
}
#photo{
  position:absolute;
  left:50%;
  top:50%;
  max-width:none;
  display:none;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}
#frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}
.controls{margin-top:18px;display:grid;gap:12px}
button,.pick{
  border:0;border-radius:12px;padding:14px 18px;font-size:16px;
  font-weight:700;cursor:pointer
}
.pick{background:#1268d3;color:#fff;display:inline-block}
button{background:#ffcc35;color:#07396e}
button.secondary{background:#dcecff}
input[type=file]{display:none}
.zoom{display:flex;align-items:center;gap:10px;justify-content:center}
.zoom input{width:70%}
small{display:block;margin-top:12px;color:#52708f;line-height:1.45}
#previewWrap{display:none;margin-top:18px}
#preview{width:min(92vw,560px);border-radius:22px;box-shadow:0 8px 30px #0b4d8c22}
@media(max-width:480px){
  .wrap{padding:12px}
  h1{font-size:23px}
  button,.pick{font-size:15px;padding:13px 14px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>CHÀO TÂN SINH VIÊN K19</h1>
  <p>Chọn ảnh, kéo để căn vị trí và phóng to/thu nhỏ.</p>

  <div class="stage" id="stage">
    <img id="photo" alt="">
    <img id="frame" src="khung-k19.png" alt="Khung K19">
  </div>

  <div class="controls">
    <label class="pick">📷 CHỌN ẢNH CỦA BẠN
      <input id="file" type="file" accept="image/*">
    </label>

    <div class="zoom">
      Thu nhỏ
      <input id="zoom" type="range" min="0.5" max="3" value="1" step="0.01">
      Phóng to
    </div>

    <button id="download">⬇ TẢI ẢNH ĐẠI DIỆN</button>
    <button id="reset" class="secondary">↺ CĂN LẠI ẢNH</button>
  </div>

  <div id="previewWrap">
    <p><b>Nếu điện thoại không tự tải:</b> nhấn giữ ảnh bên dưới → chọn “Lưu vào Ảnh/Photos”.</p>
    <img id="preview" alt="Ảnh avatar đã tạo">
  </div>

  <small>Ảnh chỉ được xử lý ngay trên thiết bị của bạn, không tải lên máy chủ.</small>
</div>

<canvas id="canvas" width="1200" height="1200" hidden></canvas>

<script>
const stage = document.getElementById('stage');
const photo = document.getElementById('photo');
const file = document.getElementById('file');
const zoom = document.getElementById('zoom');
const previewWrap = document.getElementById('previewWrap');
const preview = document.getElementById('preview');

let img = new Image();
let scale = 1, x = 0, y = 0;
let dragging = false;
let startX = 0, startY = 0, originX = 0, originY = 0;

function fitBase(stageW, stageH, iw, ih){
  return Math.max(stageW / iw, stageH / ih);
}

function render(){
  if(!img.src || !img.naturalWidth) return;
  photo.style.display = 'block';
  photo.src = img.src;

  const base = fitBase(stage.clientWidth, stage.clientHeight, img.naturalWidth, img.naturalHeight);
  const s = base * scale;

  photo.style.width = (img.naturalWidth * s) + 'px';
  photo.style.height = (img.naturalHeight * s) + 'px';
  photo.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
}

function resetPhoto(){
  scale = 1;
  x = 0;
  y = 0;
  zoom.value = 1;
  render();
}

file.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;

  const url = URL.createObjectURL(f);
  img = new Image();

  img.onload = () => {
    photo.src = url;
    resetPhoto();
    previewWrap.style.display = 'none';
  };

  img.onerror = () => alert('Không đọc được ảnh này. Hãy thử chọn ảnh JPG hoặc PNG khác.');
  img.src = url;
});

zoom.addEventListener('input', () => {
  scale = parseFloat(zoom.value);
  render();
});

stage.addEventListener('pointerdown', e => {
  if(!img.src) return;
  dragging = true;
  startX = e.clientX;
  startY = e.clientY;
  originX = x;
  originY = y;
  try{ stage.setPointerCapture(e.pointerId); }catch(_){}
});

stage.addEventListener('pointermove', e => {
  if(!dragging) return;
  x = originX + (e.clientX - startX);
  y = originY + (e.clientY - startY);
  render();
});

function stopDrag(){ dragging = false; }
stage.addEventListener('pointerup', stopDrag);
stage.addEventListener('pointercancel', stopDrag);
stage.addEventListener('pointerleave', e => { if(e.pointerType === 'mouse') stopDrag(); });

document.getElementById('reset').addEventListener('click', resetPhoto);
window.addEventListener('resize', render);

async function buildAvatar(){
  if(!img.src){
    alert('Bạn hãy chọn ảnh trước.');
    return null;
  }

  const c = document.getElementById('canvas');
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);

  const base = fitBase(W, H, img.naturalWidth, img.naturalHeight);
  const s = base * scale;
  const ratio = W / stage.clientWidth;

  const dw = img.naturalWidth * s;
  const dh = img.naturalHeight * s;

  ctx.drawImage(
    img,
    (W - dw)/2 + x * ratio,
    (H - dh)/2 + y * ratio,
    dw,
    dh
  );

  const fr = new Image();
  fr.src = 'khung-k19.png';

  await new Promise((resolve, reject) => {
    if(fr.complete) resolve();
    else{
      fr.onload = resolve;
      fr.onerror = reject;
    }
  });

  ctx.drawImage(fr, 0, 0, W, H);

  return new Promise(resolve => {
    c.toBlob(blob => resolve(blob), 'image/png', 1);
  });
}

document.getElementById('download').addEventListener('click', async () => {
  const blob = await buildAvatar();
  if(!blob) return;

  const objectUrl = URL.createObjectURL(blob);

  // Desktop / Android / browsers that support download attribute
  const a = document.createElement('a');
  a.href = objectUrl;
  a.download = 'avatar-k19.png';
  document.body.appendChild(a);
  a.click();
  a.remove();

  // iPhone/iPad Safari fallback: show the generated image so user can press-and-hold to save
  preview.src = objectUrl;
  previewWrap.style.display = 'block';

  // Try Web Share API if supported
  if(navigator.share && navigator.canShare){
    try{
      const shareFile = new File([blob], 'avatar-k19.png', {type:'image/png'});
      if(navigator.canShare({files:[shareFile]})){
        await navigator.share({
          files:[shareFile],
          title:'Avatar K19'
        });
      }
    }catch(e){
      // User may cancel; preview remains available
    }
  }

  setTimeout(() => {
    try{ URL.revokeObjectURL(objectUrl); }catch(_){}
  }, 120000);
});
</script>
</body>
</html>
