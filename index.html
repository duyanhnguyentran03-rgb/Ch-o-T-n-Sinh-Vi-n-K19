<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Welcome K19</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef7ff;color:#083b78}
.wrap{max-width:640px;margin:auto;padding:16px;text-align:center}
h1{margin:6px 0 6px;font-size:28px}
p{margin:0 0 16px}
.stage{
  position:relative;width:min(92vw,560px);aspect-ratio:1;margin:auto;
  overflow:hidden;background:#fff;border-radius:22px;
  box-shadow:0 8px 30px #0b4d8c22;touch-action:none;user-select:none
}
#photo{
  position:absolute;left:50%;top:50%;display:none;max-width:none;
  pointer-events:none;user-select:none;-webkit-user-drag:none
}
#frame{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  pointer-events:none;user-select:none;-webkit-user-drag:none
}
.controls{margin-top:18px;display:grid;gap:12px}
.fileButton{
  position:relative;overflow:hidden;background:#1268d3;color:#fff;
  border-radius:12px;padding:15px 18px;font-size:16px;font-weight:700
}
.fileButton input{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;cursor:pointer;font-size:100px
}
button{
  border:0;border-radius:12px;padding:14px 18px;font-size:16px;
  font-weight:700;cursor:pointer
}
.download{background:#ffcc35;color:#07396e}
.reset{background:#dcecff;color:#07396e}
.zoom{display:flex;align-items:center;gap:10px;justify-content:center}
.zoom input{width:70%}
#previewWrap{display:none;margin-top:16px}
#preview{width:min(92vw,560px);border-radius:20px}
small{display:block;margin-top:12px;color:#52708f;line-height:1.4}
@media(max-width:480px){h1{font-size:23px}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>CHÀO TÂN SINH VIÊN K19</h1>
  <p>Chọn ảnh, kéo để căn vị trí và phóng to/thu nhỏ.</p>

  <div class="stage" id="stage">
    <img id="photo" alt="">
    <img id="frame" src="khung-k19.png" alt="Khung K19">
  </div>

  <div class="controls">
    <div class="fileButton">
      📷 CHỌN ẢNH CỦA BẠN
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/*">
    </div>

    <div class="zoom">
      <span>Thu nhỏ</span>
      <input id="zoom" type="range" min="0.5" max="3" value="1" step="0.01">
      <span>Phóng to</span>
    </div>

    <button class="download" id="download">⬇ TẢI ẢNH ĐẠI DIỆN</button>
    <button class="reset" id="reset">↺ CĂN LẠI ẢNH</button>
  </div>

  <div id="previewWrap">
    <p><b>iPhone:</b> nếu ảnh không tự tải, nhấn giữ ảnh dưới đây → Lưu vào Ảnh.</p>
    <img id="preview" alt="Avatar K19">
  </div>

  <small>Ảnh được xử lý trực tiếp trên thiết bị, không tải lên máy chủ.</small>
</div>

<canvas id="canvas" width="1200" height="1200" hidden></canvas>

<script>
const file = document.getElementById('file');
const stage = document.getElementById('stage');
const photo = document.getElementById('photo');
const zoom = document.getElementById('zoom');
const previewWrap = document.getElementById('previewWrap');
const preview = document.getElementById('preview');

let img = new Image();
let scale=1,x=0,y=0;
let dragging=false,sx=0,sy=0,ox=0,oy=0;

function baseScale(w,h,iw,ih){ return Math.max(w/iw,h/ih); }

function render(){
  if(!img.src || !img.naturalWidth) return;
  const b=baseScale(stage.clientWidth,stage.clientHeight,img.naturalWidth,img.naturalHeight);
  const s=b*scale;
  photo.style.display='block';
  photo.src=img.src;
  photo.style.width=(img.naturalWidth*s)+'px';
  photo.style.height=(img.naturalHeight*s)+'px';
  photo.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;
}

function resetPhoto(){
  scale=1;x=0;y=0;zoom.value=1;render();
}

file.addEventListener('change', function(){
  const f=this.files && this.files[0];
  if(!f) return;

  const reader=new FileReader();
  reader.onload=function(e){
    const temp=new Image();
    temp.onload=function(){
      img=temp;
      resetPhoto();
      previewWrap.style.display='none';
    };
    temp.onerror=function(){
      alert('Không đọc được ảnh. Hãy thử ảnh JPG hoặc PNG.');
    };
    temp.src=e.target.result;
  };
  reader.onerror=function(){ alert('Không thể mở ảnh này.'); };
  reader.readAsDataURL(f);
});

zoom.addEventListener('input',()=>{scale=parseFloat(zoom.value);render()});

stage.addEventListener('pointerdown',e=>{
  if(!img.src)return;
  dragging=true;sx=e.clientX;sy=e.clientY;ox=x;oy=y;
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
});
stage.addEventListener('pointermove',e=>{
  if(!dragging)return;
  x=ox+e.clientX-sx;y=oy+e.clientY-sy;render();
});
stage.addEventListener('pointerup',()=>dragging=false);
stage.addEventListener('pointercancel',()=>dragging=false);

document.getElementById('reset').addEventListener('click',resetPhoto);
window.addEventListener('resize',render);

async function makeAvatar(){
  if(!img.src){alert('Bạn hãy chọn ảnh trước.');return null}

  const c=document.getElementById('canvas');
  const ctx=c.getContext('2d');
  const W=c.width,H=c.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);

  const b=baseScale(W,H,img.naturalWidth,img.naturalHeight);
  const s=b*scale;
  const ratio=W/stage.clientWidth;
  const dw=img.naturalWidth*s, dh=img.naturalHeight*s;

  ctx.drawImage(img,(W-dw)/2+x*ratio,(H-dh)/2+y*ratio,dw,dh);

  const fr=new Image();
  fr.src='khung-k19.png?v=2';
  await new Promise((res,rej)=>{
    if(fr.complete && fr.naturalWidth) res();
    else{fr.onload=res;fr.onerror=rej}
  });
  ctx.drawImage(fr,0,0,W,H);

  return new Promise(resolve=>c.toBlob(resolve,'image/png',1));
}

document.getElementById('download').addEventListener('click',async()=>{
  const blob=await makeAvatar();
  if(!blob)return;

  const url=URL.createObjectURL(blob);
  preview.src=url;
  previewWrap.style.display='block';

  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

  if(!isIOS){
    const a=document.createElement('a');
    a.href=url;a.download='avatar-k19.png';
    document.body.appendChild(a);a.click();a.remove();
  }else{
    preview.scrollIntoView({behavior:'smooth',block:'center'});
  }
});
</script>
</body>
</html>
